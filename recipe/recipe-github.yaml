# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/refs/heads/renovate/pixi/schema.json
schema_version: 1

context:
  version: "0.15.0"
  python_min: "3.12"

recipe:
  name: hydra-python
  version: ${{ version }}

source:
  - url: https://github.com/CategoricalData/hydra/archive/refs/tags/${{ version }}.tar.gz
    sha256: f156dd703b75448d288c4b7f65748cee62e8e5913fe48e25d630433f76669021
  - path: dist/python/
    target_directory: dist/python/

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: hydra-kernel
      version: ${{ version }}
    build:
      noarch: python
      script:
        - cd dist/python/hydra-kernel
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - hydra.core
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra kernel - core types, terms, DSL, eval, and primitives
      license: Apache-2.0
      license_file: LICENSE

  - package:
      name: hydra-rdf
      version: ${{ version }}
    build:
      noarch: python
      script:
        - cd dist/python/hydra-rdf
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra RDF - RDF, OWL, SHACL, ShEx, and XML Schema models
      license: Apache-2.0
      license_file: LICENSE

  - package:
      name: hydra-pg
      version: ${{ version }}
    build:
      noarch: python
      script:
        - cd dist/python/hydra-pg
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
        - ${{ pin_subpackage('hydra-rdf', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
        - ${{ pin_subpackage('hydra-rdf', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra PG - property graph model, coders, GraphSON, and TinkerPop
      license: Apache-2.0
      license_file: LICENSE

