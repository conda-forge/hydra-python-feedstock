# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/refs/heads/renovate/pixi/schema.json
schema_version: 1

context:
  version: "0.17.5"
  python_min: "3.12"

recipe:
  name: hydra-python
  version: ${{ version }}

build:
  number: 1
  noarch: python

outputs:
  - package:
      name: hydra-kernel
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-kernel/hydra_kernel-${{ version }}.tar.gz
      sha256: "c38509a949d800748c7a1be51c70a43b05c4b1ee809f7e660353851ff9d44ea4"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - hydra.core
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
    about:
      summary: Hydra kernel - core types, terms, DSL, eval, and primitives
      license: Apache-2.0
      license_file: LICENSE

  - package:
      name: hydra-rdf
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-rdf/hydra_rdf-${{ version }}.tar.gz
      sha256: "799ceb69f1678c64d8f747a1dc8168530363fa91b5d5ac4f425cc3946c1e41f2"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra RDF - RDF, OWL, SHACL, ShEx, and XML Schema models
      license: Apache-2.0
      license_file: LICENSE

  - package:
      name: hydra-pg
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-pg/hydra_pg-${{ version }}.tar.gz
      sha256: "a6adeb40e505a5d5b5483c7208a93088a2be47877109252c2029ca0b488f9594"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
        - ${{ pin_subpackage('hydra-rdf', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
        - ${{ pin_subpackage('hydra-rdf', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra PG - property graph model, coders, GraphSON, and TinkerPop
      license: Apache-2.0
      license_file: LICENSE

