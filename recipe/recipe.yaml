# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/refs/heads/renovate/pixi/schema.json
schema_version: 1

context:
  version: "0.16.0"
  python_min: "3.12"

recipe:
  name: hydra-python
  version: ${{ version }}

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: hydra-kernel
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-kernel/hydra_kernel-${{ version }}.tar.gz
      sha256: "215c4c097a34bc24c5a0e74dfe263e6082a841f6bf6b6c4f8bcfaabb65514e82"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - hydra.core
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra kernel - core types, terms, DSL, eval, and primitives
      license: Apache-2.0
      license_file: LICENSE

  - package:
      name: hydra-rdf
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-rdf/hydra_rdf-${{ version }}.tar.gz
      sha256: "aeba504b0ed7b3a3ed1e1643aba353d3ad5e4bd1b5a8bd05277670ef485839d6"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra RDF - RDF, OWL, SHACL, ShEx, and XML Schema models
      license: Apache-2.0
      license_file: LICENSE

  - package:
      name: hydra-pg
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-pg/hydra_pg-${{ version }}.tar.gz
      sha256: "0d707319a1a11d728917a94bfbf0999f2ace83adc5e7dd53b9fa56353aa71541"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
        - ${{ pin_subpackage('hydra-rdf', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
        - ${{ pin_subpackage('hydra-rdf', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra PG - property graph model, coders, GraphSON, and TinkerPop
      license: Apache-2.0
      license_file: LICENSE

