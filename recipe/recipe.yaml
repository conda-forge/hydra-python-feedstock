  - package:
      name: hydra-python
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-python/hydra_python-${{ version }}.tar.gz
      sha256: "87fef1b870ee4d6055f794d7b78ef468c08e084ba8940a682b5a4372fe574956"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - sed -i 's|readme = ".*"|readme = { text = "Python syntax, serde, and coder for Hydra", content-type = "text/markdown" }|' pyproject.toml
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra Python - Python syntax, serde, and coder
      license: Apache-2.0
      license_file: LICENSE

about:
  homepage: https://github.com/CategoricalData/hydra
  license: Apache-2.0
  license_file: LICENSE
  summary: Hydra - type-aware data transformation toolkit
  description: |
    Hydra is a domain-specific language for data models and data transformations.
    It is based on a typed lambda calculus, and transforms data and schemas between
    languages in a way which maintains type conformance. Starting with 0.15, the
    Python release ships per-package wheels using PEP 420 implicit namespace packages,
    so multiple wheels install side-by-side and merge their hydra.* contents at
    import time.
  repository: https://github.com/CategoricalData/hydra
  documentation: https://github.com/CategoricalData/hydra/wiki

extra:
  recipe-maintainers:
    - joshsh
    - phreed
