# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/refs/heads/renovate/pixi/schema.json
schema_version: 1

context:
  version: "0.17.4"
  python_min: "3.12"

recipe:
  name: hydra-python
  version: ${{ version }}

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: hydra-kernel
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-kernel/hydra_kernel-${{ version }}.tar.gz
      sha256: "2a8cd2b8d4a7fbdd751eca1829a88775260f97fc3e1023c49f7bfa237bf17f06"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - hydra.core
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra kernel - core types, terms, DSL, eval, and primitives
      license: Apache-2.0
      license_file: LICENSE

  - package:
      name: hydra-rdf
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-rdf/hydra_rdf-${{ version }}.tar.gz
      sha256: "bfce583ab23a66254be7603d2bbd36031af5f00b167423174e31e662a80308be"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra RDF - RDF, OWL, SHACL, ShEx, and XML Schema models
      license: Apache-2.0
      license_file: LICENSE

  - package:
      name: hydra-pg
      version: ${{ version }}
    source:
      url: https://pypi.org/packages/source/h/hydra-pg/hydra_pg-${{ version }}.tar.gz
      sha256: "b23cfd9548a1c4a04291b4e8a1e13e9afd0330ac0e1d597d177e83034157d015"
    build:
      noarch: python
      script:
        - cp $RECIPE_DIR/LICENSE .
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling >=1.8.0
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
        - ${{ pin_subpackage('hydra-rdf', exact=True) }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('hydra-kernel', exact=True) }}
        - ${{ pin_subpackage('hydra-rdf', exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
    about:
      summary: Hydra PG - property graph model, coders, GraphSON, and TinkerPop
      license: Apache-2.0
      license_file: LICENSE

